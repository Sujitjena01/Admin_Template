<!DOCTYPE html>
<html lang="en">
<head>
  <title>TP Odisha Discom :: Admin Template</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="assets/css/bootstrap.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/style-dark.css" rel="stylesheet">
  <link href="assets/css/award.css" rel="stylesheet">
  <link href="assets/css/light-gallery.css" rel="stylesheet">
  <script src="assets/js/bootstrap.min.js"></script>
  <script src="assets/js/pages/header.js"></script>
  <script src="assets/js/pages/sidebar.js"></script>
  <script src="assets/js/pages/footer.js"></script>
  <script src="assets/js/FontAwesome.js"></script>
  <link href="assets/css/bootstrap-datepicker.css" rel="stylesheet">  
  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.js"> </script>  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.5.0/js/bootstrap-datepicker.js"> </script> 
 
</head>
<body>
<section class="main-body">
  <main-header></main-header>
  <div class="middle-body">
    <!-- <section class="body-breadcrumb">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-12">

    <main-sidebar></main-sidebar>

    <section class="box-div">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-12">
            <div class="welcome">
              <div class="left">
                <i class="fa fa-user" aria-hidden="true"></i>
                <p>Hello! Sujit Kumar Jena</p>
              </div>
              <div class="right">
                <p><strong>BAICMS / </strong><span>Forms</span></p>
              </div>
            </div>
          </div>
        </div>
        <div class="row ">
          <div class="col-md-12">
            <div class="title mt-3">
                <h5><strong>Forms</strong></h5>
            </div>
            <div class="buttons mt-3">
              <p>Use the custom input styles for actions in forms. for more input styles, <a href="https://getbootstrap.com/docs/5.2/forms/overview/" target="_blank">Click Here</a>.</p>
                <div class="sub-title mt-3">
                    <h5><strong>Default input</strong></h5>
                </div>  
                <div class="mt-3">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label">Name</label>
                                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter Your Name">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div>
                </div>
                
                <div class="mt-3">
                    
                </div>
                
                <div class="sub-title mt-3">
                    <h5><strong>Disabled input</strong></h5>
                </div>
                <div class="mt-3">
                    <div class="row">
                        <div class="col-md-6">
                            <input class="form-control" type="text" placeholder="Disabled input" aria-label="Disabled input example" disabled>
                        </div>
                        <div class="col-md-6">
                            <input class="form-control" type="text" value="Disabled readonly input" aria-label="Disabled input example" disabled readonly>
                        </div>
                    </div>
                </div>
                <div class="sub-title mt-3">
                    <h5><strong>Floating labels</strong></h5>
                </div>
                <div class="mt-3">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                                <label for="floatingInput">Email address</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                                <label for="floatingPassword">Password</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="sub-title mt-3">
                    <h5><strong>Select</strong></h5>
                </div>
                <div class="mt-3 d-grid gap-2">
                    <select class="form-select" aria-label="Default select example">
                        <option selected>Open this select menu</option>
                        <option value="1">One</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>
                </div>
                <div class="sub-title mt-3">
                  <h5><strong>Multiple Select</strong></h5>
                </div>
                <div class="mt-3 d-grid gap-2">
                  <div class="row">
                    <div class="col-md-12">
                         
                      <link rel="stylesheet" href="assets/css/select2.css" />
                      <link rel="stylesheet" href="assets/css/select2-bootstrap-5.css" />
                      
                      <div class="form-floating">
                          <select class="form-select" id="multiple-select-clear-field" data-placeholder="Choose anything" multiple>
                            <option>Christmas Island</option>
                            <option>South Sudan</option>
                            <option>Jamaica</option>
                            <option>Kenya</option>
                            <option>French Guiana</option>
                            <option>Mayotta</option>
                            <option>Liechtenstein</option>
                            <option>Denmark</option>
                            <option>Eritrea</option>
                            <option>Gibraltar</option>
                            <option>Saint Helena, Ascension and Tristan da Cunha</option>
                            <option>Haiti</option>
                            <option>Namibia</option>
                            <option>South Georgia and the South Sandwich Islands</option>
                            <option>Vietnam</option>
                            <option>Yemen</option>
                            <option>Philippines</option>
                            <option>Benin</option>
                            <option>Czech Republic</option>
                            <option>Russia</option>
                        </select>
                      </div>
                      
                     <!-- Scripts -->
                      <script src="assets/js/select2.js"></script>
                      <script>
                        $( '#multiple-select-clear-field' ).select2( {
                          theme: "bootstrap-5",
                          width: $( this ).data( 'width' ) ? $( this ).data( 'width' ) : $( this ).hasClass( 'w-100' ) ? '100%' : 'style',
                          placeholder: $( this ).data( 'placeholder' ),
                          closeOnSelect: false,
                          allowClear: true,
                      } );
                      </script>
                    </div>
                  </div>
                </div>
                <div class="sub-title mt-3">
                    <h5><strong>Checks and Radios</strong></h5>
                </div>
                <div class="mt-3 d-grid gap-2">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" checked id="defaultCheck1">
                                <label class="form-check-label" for="defaultCheck1">
                                  Default checkbox
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="defaultCheck1">
                                <label class="form-check-label" for="defaultCheck1">
                                  Second default checkbox
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="defaultCheck2" disabled>
                                <label class="form-check-label" for="defaultCheck2">
                                    Disabled checkbox
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="option1" checked>
                                <label class="form-check-label" for="exampleRadios1">
                                  Default radio
                                </label>
                              </div>
                              <div class="form-check">
                                <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="option2">
                                <label class="form-check-label" for="exampleRadios2">
                                  Second default radio
                                </label>
                              </div>
                              <div class="form-check">
                                <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios3" value="option3" disabled>
                                <label class="form-check-label" for="exampleRadios3">
                                  Disabled radio
                                </label>
                              </div>
                        </div>
                    </div>
                </div>
                <div class="sub-title mt-3">
                    <h5><strong>Switches</strong></h5>
                </div>
                <div class="mt-3 d-grid gap-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault">
                        <label class="form-check-label" for="flexSwitchCheckDefault">Default switch checkbox input</label>
                      </div>
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
                        <label class="form-check-label" for="flexSwitchCheckChecked">Checked switch checkbox input</label>
                      </div>
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDisabled" disabled>
                        <label class="form-check-label" for="flexSwitchCheckDisabled">Disabled switch checkbox input</label>
                      </div>
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckCheckedDisabled" checked disabled>
                        <label class="form-check-label" for="flexSwitchCheckCheckedDisabled">Disabled checked switch checkbox input</label>
                      </div>
                </div>
            </div>
          </div>
        </div>
      </div>
      <footer>
        <div class="container">
          <div class="row">
            <div class="col-md-12">
              <p>&copy; 2022 - Developed by Odisha Discom IT Team || All Rights Reserved.</p>
            </div>
          </div>
        </div>
      </footer>
    </section>
  </div>
  
</section>
</body>
