<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap 5 Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>

body {
  overflow: hidden;
}
.full-body{
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-image: url(assets/images/left-bg.png);
    background-size: cover;
    background-position: bottom;
    /* background: linear-gradient(135deg, rgba(2,0,36,1) 0%, rgba(17,46,99,1) 66%, rgba(35,100,173,1) 100%); */
}
.full-body::before{
    content: "";
    position: absolute;
    top: 0px;
    left: 0px;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, rgb(2 0 36 / 96%) 0%, rgb(17 46 99 / 96%) 66%, rgb(35 100 173 / 96%) 100%);
}
.ocean { 
    height: auto;
    width: 100%;
    position: absolute;
    bottom: -142px;
    left: -70px;
    background: #015871;
    transform: rotate(13deg);
}

.wave {
  background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/85486/wave.svg) repeat-x; 
  position: absolute;
  top: -198px;
  width: 6400px;
  height: 198px;
  animation: wave 7s cubic-bezier( 0.36, 0.45, 0.63, 0.53) infinite;
  transform: translate3d(0, 0, 0);
}

.wave:nth-of-type(2) {
  top: -175px;
  animation: wave 8s cubic-bezier( 0.36, 0.45, 0.63, 0.53) -.125s infinite, swell 7s ease -1.25s infinite;
  opacity: 1;
}
.ocean1 { 
    height: auto;
    width: 100%;
    position: absolute;
    top: -178px;
    left: 95px;
    background: #015871;
    transform: rotate(197deg);
}

.wave1 {
  background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/85486/wave.svg) repeat-x; 
  position: absolute;
  top: -198px;
  width: 6400px;
  height: 198px;
  animation: wave 10s cubic-bezier( 0.36, 0.45, 0.63, 0.53) infinite;
  transform: translate3d(0, 0, 0);
}

.wave1:nth-of-type(2) {
  top: -175px;
  animation: wave 8s cubic-bezier( 0.36, 0.45, 0.63, 0.53) -.125s infinite, swell 7s ease -1.25s infinite;
  opacity: 1;
}
@keyframes wave {
  0% {
    margin-left: 0;
  }
  100% {
    margin-left: -1600px;
  }
}

@keyframes swell {
  0%, 100% {
    transform: translate3d(0,-25px,0);
  }
  50% {
    transform: translate3d(0,5px,0);
  }
}
  </style>
</head>
<body>

<section class="full-body">
    <div class="ocean">
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    <div class="ocean1">
        <div class="wave1"></div>
        <div class="wave1"></div>
    </div>
</section>

</body>
</html>
