<!DOCTYPE html>
<html>
<head>
	<title>Dynamic form</title>
	<script type="text/javascript" src="js/script.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
	<link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet" />
	
</head>
<body>
<div class="container">
	<div class="row">
		<div class="col-xs-12">
			<div class="box">
				<div class="box-body">
					<h3>Dynamic Add/delete row</h3>
                    <div class="col-md-10" style="margin-left: -15px">
                    <div class="table-responsive">
                        <table id="test-table" class="table table-condensed">
                        <thead>
                            <tr>
                            <th>From</th>
                            <th>To</th>
                            </tr>
                        </thead>
                        <tbody id="test-body">
                            <tr id="row0">
                            <td>
                                <input name='from_value0' value='100' type='text' class='form-control' />
                            </td>
                            <td>
                                <input name='to_value0' value='500' type='text' class='form-control input-md' />
                            </td>
                            <td>
                                <input class='delete-row btn btn-primary' type='button' value='Delete' />
                            </td>
                            </tr>
                        </tbody>
                        </table>
                        <input id='add-row' class='btn btn-primary' type='button' value='Add' />
                    </div>
                    </div>
				</div>
			</div>
		</div>
        
	</div>
</div>
<script>
      // Add row
  var row=1;
  $(document).on("click", "#add-row", function () {
  var new_row = '<tr id="row' + row + '"><td><input name="from_value' + row + '" type="text" class="form-control" /></td><td><input name="to_value' + row + '" type="text" class="form-control" /></td><td><input class="delete-row btn btn-primary" type="button" value="Delete" /></td></tr>';
    
  $('#test-body').append(new_row);
  row++;
  return false;
  });
  
  // Remove criterion
  $(document).on("click", ".delete-row", function () {
  //  alert("deleting row#"+row);
    if(row>1) {
      $(this).closest('tr').remove();
      row--;
    }
  return false;
  });

</script>
</body>
</html>
